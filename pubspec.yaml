name: lylyrics
description: "Visor de letras sincronizadas para reproductores MPRIS en Linux."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Estado: Riverpod para inyectar MediaSource / LyricsProvider y exponer
  # streams a la UI sin plumbing manual.
  flutter_riverpod: ^3.4.3

  # Transporte D-Bus para hablar MPRIS con los reproductores.
  dbus: ^0.8.0

  # Peticiones HTTP contra lrclib.net (cliente simple con timeout).
  http: ^1.6.0

  # Caché local de letras: sqflite_common_ffi no requiere dependencias
  # nativas extra (usa sqlite3 de libsqlite3 del sistema).
  sqflite_common_ffi: ^2.4.3

  # Ventana de escritorio: tamaño mínimo, siempre encima, foco.
  window_manager: ^0.5.2

  # Auto-scroll suave saltando a la línea actual.
  scrollable_positioned_list: ^0.3.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Reloj y temporizadores controlados para probar el motor de sincronización.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true